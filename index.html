<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมจับคู่ธงชาติ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap');

    :root {
      --bg-top: #d9f3ff;
      --bg-bottom: #fff6dd;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-border: #1f4e5f;
      --accent: #ff8a5b;
      --accent-strong: #ff5f2e;
      --secondary: #3a86ff;
      --success: #22a06b;
      --text: #163240;
      --muted: #5f7480;
      --shadow: 0 18px 40px rgba(20, 60, 90, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Baloo 2', 'Noto Sans Thai', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 32%),
        radial-gradient(circle at bottom right, rgba(255, 206, 109, 0.45), transparent 28%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      opacity: 0.22;
      z-index: 0;
      pointer-events: none;
      filter: blur(3px);
    }

    body::before {
      top: 30px;
      right: 5vw;
      background: #8ed1fc;
    }

    body::after {
      left: -80px;
      bottom: 60px;
      background: #ffcb77;
    }

    .app {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 24px));
      margin: 24px auto;
      padding: 20px;
      border-radius: 28px;
      background: var(--panel);
      border: 3px solid rgba(31, 78, 95, 0.12);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .hero {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1;
    }

    .hero p {
      margin: 0;
      font-family: 'Noto Sans Thai', sans-serif;
      font-size: 1rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .pill,
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: inherit;
    }

    .pill {
      background: rgba(58, 134, 255, 0.12);
      color: var(--text);
      font-family: 'Noto Sans Thai', sans-serif;
    }

    button {
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 10px 22px rgba(255, 95, 46, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(255, 95, 46, 0.34);
      outline: none;
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 160px minmax(260px, 1.2fr);
      gap: 14px;
      align-items: start;
    }

    .column {
      position: relative;
      display: grid;
      gap: 12px;
    }

    #sourceList,
    #targetList {
      display: grid;
      gap: 10px;
    }

    .column-title {
      margin: 0 0 4px;
      font-size: 1.1rem;
      color: var(--muted);
      text-align: center;
    }

    .source-item,
    .target-item {
      position: relative;
      min-height: 58px;
      display: flex;
      align-items: center;
      border-radius: 22px;
      border: 3px solid transparent;
      background: white;
      box-shadow: 0 10px 20px rgba(33, 59, 74, 0.08);
      user-select: none;
    }

    .source-item {
      justify-content: space-between;
      gap: 14px;
      padding: 8px 14px;
      cursor: grab;
    }

    .source-item:active {
      cursor: grabbing;
    }

    .source-item.dragging {
      border-color: var(--secondary);
      transform: scale(1.02);
      box-shadow: 0 18px 30px rgba(58, 134, 255, 0.2);
    }

    .target-item {
      padding: 10px 14px;
      justify-content: space-between;
      border-color: rgba(58, 134, 255, 0.12);
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .target-item.highlight {
      border-color: var(--secondary);
      background: #eef6ff;
      transform: translateX(-4px);
    }

    .target-item.matched {
      border-color: rgba(34, 160, 107, 0.35);
      background: #f0fff7;
    }

    .flag {
      font-size: 2rem;
      line-height: 1;
    }

    .drag-hint,
    .target-text,
    .note,
    .score-summary {
      font-family: 'Noto Sans Thai', sans-serif;
    }

    .drag-hint {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: right;
    }

    .target-text strong,
    .target-text span {
      display: block;
      line-height: 1.2;
    }

    .target-text strong {
      font-size: 1.08rem;
    }

    .target-text span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .match-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d8e9ff;
      border: 3px solid var(--secondary);
      flex: 0 0 auto;
    }

    .source-item .match-dot {
      margin-left: auto;
    }

    .target-item .match-dot {
      margin-right: 12px;
      order: -1;
    }

    .center-guide {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding-top: 50px;
    }

    .note {
      max-width: 130px;
      padding: 12px 14px;
      border-radius: 22px;
      background: linear-gradient(180deg, #fffdf4, #fff4cc);
      border: 2px dashed rgba(22, 50, 64, 0.18);
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .connections line {
      stroke-width: 6;
      stroke-linecap: round;
      filter: drop-shadow(0 6px 10px rgba(58, 134, 255, 0.18));
    }

    .score-panel {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(58, 134, 255, 0.12), rgba(255, 138, 91, 0.14));
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .score-panel strong {
      display: block;
      font-size: 1.35rem;
    }

    .score-summary {
      color: var(--muted);
    }

    .score-badge {
      padding: 10px 16px;
      border-radius: 999px;
      background: white;
      color: var(--text);
      box-shadow: inset 0 0 0 2px rgba(22, 50, 64, 0.08);
    }

    .result-banner {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #fff;
      border: 2px solid rgba(34, 160, 107, 0.24);
      display: none;
      font-family: 'Noto Sans Thai', sans-serif;
    }

    .result-banner.show {
      display: block;
      animation: pop-in 0.28s ease;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 820px) {
      .app {
        padding: 16px;
      }

      .board {
        grid-template-columns: minmax(180px, 1fr) 92px minmax(220px, 1.1fr);
        gap: 12px;
      }

      .source-item,
      .target-item {
        min-height: 52px;
      }

      .note {
        padding: 10px 12px;
        font-size: 0.88rem;
      }
    }

    @media (max-width: 640px) {
      .board {
        grid-template-columns: 1fr;
      }

      .center-guide {
        min-height: auto;
        padding-top: 0;
      }

      .note {
        max-width: none;
      }

      .connections {
        display: none;
      }

      .source-item,
      .target-item {
        min-height: 72px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>เกมจับคู่ธงชาติ</h1>
      <p>ลากธงชาติทางซ้ายไปจับคู่กับชื่อประเทศภาษาไทยและภาษาอังกฤษทางขวาให้ถูกต้อง</p>
    </section>

    <section class="toolbar">
      <div class="pill" id="roundInfo">สุ่มคำถาม 10 ข้อ</div>
      <div class="pill" id="progressInfo">จับคู่แล้ว 0 / 10</div>
      <button id="resetButton" type="button">สุ่มใหม่</button>
    </section>

    <section class="board" id="board">
      <svg class="connections" id="connections" aria-hidden="true"></svg>

      <div class="column">
        <h2 class="column-title">ธงชาติ</h2>
        <div id="sourceList"></div>
      </div>

      <div class="center-guide">
        <div class="note">ลากจากจุดสีฟ้า แล้วปล่อยลงที่ชื่อประเทศ</div>
      </div>

      <div class="column">
        <h2 class="column-title">ชื่อประเทศ</h2>
        <div id="targetList"></div>
      </div>
    </section>

    <section class="score-panel">
      <div>
        <strong id="scoreValue">คะแนน: 0 / 10</strong>
        <div class="score-summary" id="scoreSummary">ยังจับคู่ไม่ครบ ลองต่อเส้นให้ครบทั้ง 10 ข้อ</div>
      </div>
      <div class="score-badge" id="statusBadge">พร้อมเล่น</div>
    </section>

    <section class="result-banner" id="resultBanner"></section>
  </main>

  <script>
    const countries = [
      { code: 'th', flag: '🇹🇭', thai: 'ประเทศไทย', english: 'Thailand' },
      { code: 'jp', flag: '🇯🇵', thai: 'ญี่ปุ่น', english: 'Japan' },
      { code: 'kr', flag: '🇰🇷', thai: 'เกาหลีใต้', english: 'South Korea' },
      { code: 'cn', flag: '🇨🇳', thai: 'จีน', english: 'China' },
      { code: 'in', flag: '🇮🇳', thai: 'อินเดีย', english: 'India' },
      { code: 'us', flag: '🇺🇸', thai: 'สหรัฐอเมริกา', english: 'United States' },
      { code: 'gb', flag: '🇬🇧', thai: 'สหราชอาณาจักร', english: 'United Kingdom' },
      { code: 'fr', flag: '🇫🇷', thai: 'ฝรั่งเศส', english: 'France' },
      { code: 'de', flag: '🇩🇪', thai: 'เยอรมนี', english: 'Germany' },
      { code: 'it', flag: '🇮🇹', thai: 'อิตาลี', english: 'Italy' },
      { code: 'br', flag: '🇧🇷', thai: 'บราซิล', english: 'Brazil' },
      { code: 'au', flag: '🇦🇺', thai: 'ออสเตรเลีย', english: 'Australia' },
      { code: 'ca', flag: '🇨🇦', thai: 'แคนาดา', english: 'Canada' },
      { code: 'mx', flag: '🇲🇽', thai: 'เม็กซิโก', english: 'Mexico' },
      { code: 'es', flag: '🇪🇸', thai: 'สเปน', english: 'Spain' },
      { code: 'sa', flag: '🇸🇦', thai: 'ซาอุดีอาระเบีย', english: 'Saudi Arabia' }
    ];

    const board = document.getElementById('board');
    const sourceList = document.getElementById('sourceList');
    const targetList = document.getElementById('targetList');
    const connections = document.getElementById('connections');
    const scoreValue = document.getElementById('scoreValue');
    const scoreSummary = document.getElementById('scoreSummary');
    const progressInfo = document.getElementById('progressInfo');
    const roundInfo = document.getElementById('roundInfo');
    const statusBadge = document.getElementById('statusBadge');
    const resultBanner = document.getElementById('resultBanner');
    const resetButton = document.getElementById('resetButton');

    const linePalette = ['#3a86ff', '#ff7b54', '#43aa8b', '#ffb703', '#9b5de5', '#ef476f', '#06d6a0', '#118ab2', '#fb8500', '#6a994e'];

    let currentRound = [];
    let sourceOrder = [];
    let targetOrder = [];
    let sourceMatches = new Map();
    let targetMatches = new Map();
    let activeDrag = null;
    let previewLine = null;

    function shuffle(items) {
      const cloned = [...items];
      for (let index = cloned.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [cloned[index], cloned[swapIndex]] = [cloned[swapIndex], cloned[index]];
      }
      return cloned;
    }

    function startRound() {
      const selected = shuffle(countries).slice(0, 10);
      currentRound = selected;
      sourceOrder = shuffle(selected);
      targetOrder = shuffle(selected);
      sourceMatches = new Map();
      targetMatches = new Map();
      activeDrag = null;
      previewLine = null;
      resultBanner.className = 'result-banner';
      resultBanner.textContent = '';
      renderBoard();
      updateStatus();
    }

    function renderBoard() {
      sourceList.innerHTML = '';
      targetList.innerHTML = '';
      connections.innerHTML = '';

      sourceOrder.forEach((country, index) => {
        const sourceItem = document.createElement('div');
        sourceItem.className = 'source-item';
        sourceItem.dataset.code = country.code;
        sourceItem.dataset.color = linePalette[index % linePalette.length];
        sourceItem.innerHTML = `
          <span class="flag" aria-hidden="true">${country.flag}</span>
          <span class="drag-hint">ลากไปหาชื่อประเทศ</span>
          <span class="match-dot"></span>
        `;
        sourceItem.addEventListener('pointerdown', handlePointerDown);
        sourceList.appendChild(sourceItem);
      });

      targetOrder.forEach((country) => {
        const targetItem = document.createElement('div');
        targetItem.className = 'target-item';
        targetItem.dataset.code = country.code;
        targetItem.innerHTML = `
          <span class="match-dot"></span>
          <div class="target-text">
            <strong>${country.thai}</strong>
            <span>${country.english}</span>
          </div>
        `;
        targetList.appendChild(targetItem);
      });
    }

    function handlePointerDown(event) {
      const sourceItem = event.currentTarget;
      event.preventDefault();

      const sourceCode = sourceItem.dataset.code;
      clearMatchFromSource(sourceCode);

      activeDrag = {
        sourceCode,
        sourceElement: sourceItem,
        color: sourceItem.dataset.color,
        pointerId: event.pointerId
      };

      sourceItem.classList.add('dragging');
      try {
        sourceItem.setPointerCapture(event.pointerId);
      } catch (_error) {
      }
      previewLine = createLine(activeDrag.color, true);
      drawPreviewLine(event.clientX, event.clientY);

      window.addEventListener('pointermove', handlePointerMove);
      window.addEventListener('pointerup', handlePointerUp);
      window.addEventListener('pointercancel', handlePointerUp);
    }

    function handlePointerMove(event) {
      if (!activeDrag) {
        return;
      }

      drawPreviewLine(event.clientX, event.clientY);
      highlightTargetAtPoint(event.clientX, event.clientY);
    }

    function handlePointerUp(event) {
      if (!activeDrag) {
        return;
      }

      const sourceElement = activeDrag.sourceElement;
      clearHighlights();

      const dropTarget = findTargetAtPoint(event.clientX, event.clientY);
      if (dropTarget) {
        assignMatch(activeDrag.sourceCode, dropTarget.dataset.code);
      }

      if (previewLine) {
        previewLine.remove();
        previewLine = null;
      }

      sourceElement.classList.remove('dragging');
      try {
        if (sourceElement.hasPointerCapture(activeDrag.pointerId)) {
          sourceElement.releasePointerCapture(activeDrag.pointerId);
        }
      } catch (_error) {
      }

      activeDrag = null;
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerup', handlePointerUp);
      window.removeEventListener('pointercancel', handlePointerUp);
      redrawConnections();
      updateStatus();
    }

    function findTargetAtPoint(clientX, clientY) {
      const element = document.elementFromPoint(clientX, clientY);
      return element ? element.closest('.target-item') : null;
    }

    function highlightTargetAtPoint(clientX, clientY) {
      clearHighlights();
      const targetElement = findTargetAtPoint(clientX, clientY);
      if (targetElement) {
        targetElement.classList.add('highlight');
      }
    }

    function clearHighlights() {
      targetList.querySelectorAll('.highlight').forEach((item) => item.classList.remove('highlight'));
    }

    function assignMatch(sourceCode, targetCode) {
      clearMatchFromSource(sourceCode);
      clearMatchFromTarget(targetCode);
      sourceMatches.set(sourceCode, targetCode);
      targetMatches.set(targetCode, sourceCode);
      updateMatchedClasses();
    }

    function clearMatchFromSource(sourceCode) {
      if (!sourceMatches.has(sourceCode)) {
        return;
      }

      const targetCode = sourceMatches.get(sourceCode);
      sourceMatches.delete(sourceCode);
      if (targetMatches.get(targetCode) === sourceCode) {
        targetMatches.delete(targetCode);
      }
      updateMatchedClasses();
    }

    function clearMatchFromTarget(targetCode) {
      if (!targetMatches.has(targetCode)) {
        return;
      }

      const sourceCode = targetMatches.get(targetCode);
      targetMatches.delete(targetCode);
      if (sourceMatches.get(sourceCode) === targetCode) {
        sourceMatches.delete(sourceCode);
      }
      updateMatchedClasses();
    }

    function updateMatchedClasses() {
      sourceList.querySelectorAll('.source-item').forEach((item) => {
        const isMatched = sourceMatches.has(item.dataset.code);
        item.style.borderColor = isMatched ? item.dataset.color : 'transparent';
      });

      targetList.querySelectorAll('.target-item').forEach((item) => {
        item.classList.toggle('matched', targetMatches.has(item.dataset.code));
      });
    }

    function createLine(color, isPreview = false) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('stroke', color);
      line.dataset.preview = isPreview ? 'true' : 'false';
      connections.appendChild(line);
      return line;
    }

    function getBoardPoint(clientX, clientY) {
      const rect = board.getBoundingClientRect();
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function getAnchorPoint(element, side) {
      const rect = element.getBoundingClientRect();
      const boardRect = board.getBoundingClientRect();
      return {
        x: side === 'right' ? rect.right - boardRect.left : rect.left - boardRect.left,
        y: rect.top - boardRect.top + rect.height / 2
      };
    }

    function drawPreviewLine(clientX, clientY) {
      if (!activeDrag || !previewLine) {
        return;
      }

      const start = getAnchorPoint(activeDrag.sourceElement, 'right');
      const end = getBoardPoint(clientX, clientY);
      setLinePosition(previewLine, start, end);
    }

    function setLinePosition(line, start, end) {
      line.setAttribute('x1', String(start.x));
      line.setAttribute('y1', String(start.y));
      line.setAttribute('x2', String(end.x));
      line.setAttribute('y2', String(end.y));
    }

    function redrawConnections() {
      connections.querySelectorAll('line[data-preview="false"]').forEach((line) => line.remove());
      if (window.innerWidth <= 640) {
        return;
      }

      sourceMatches.forEach((targetCode, sourceCode) => {
        const sourceElement = sourceList.querySelector(`[data-code="${sourceCode}"]`);
        const targetElement = targetList.querySelector(`[data-code="${targetCode}"]`);
        if (!sourceElement || !targetElement) {
          return;
        }

        const line = createLine(sourceElement.dataset.color);
        const start = getAnchorPoint(sourceElement, 'right');
        const end = getAnchorPoint(targetElement, 'left');
        setLinePosition(line, start, end);
      });
    }

    function updateStatus() {
      const matchedCount = sourceMatches.size;
      let correctCount = 0;

      sourceMatches.forEach((targetCode, sourceCode) => {
        if (sourceCode === targetCode) {
          correctCount += 1;
        }
      });

      roundInfo.textContent = `สุ่มคำถาม ${currentRound.length} ข้อ`;
      progressInfo.textContent = `จับคู่แล้ว ${matchedCount} / ${currentRound.length}`;
      scoreValue.textContent = `คะแนน: ${correctCount} / ${currentRound.length}`;

      if (matchedCount === currentRound.length) {
        const praise = correctCount === currentRound.length
          ? 'เก่งมาก จับคู่ถูกครบทุกข้อ'
          : 'ครบแล้ว ลองกดสุ่มใหม่เพื่อเล่นอีกครั้ง';
        scoreSummary.textContent = `คุณตอบถูก ${correctCount} จาก ${currentRound.length} ข้อ`;
        statusBadge.textContent = correctCount === currentRound.length ? 'สมบูรณ์แบบ' : 'เสร็จสิ้น';
        resultBanner.textContent = `${praise} คะแนนรวม ${correctCount} / ${currentRound.length}`;
        resultBanner.className = 'result-banner show';
      } else {
        scoreSummary.textContent = 'ยังจับคู่ไม่ครบ ลองต่อเส้นให้ครบทั้ง 10 ข้อ';
        statusBadge.textContent = matchedCount === 0 ? 'พร้อมเล่น' : 'กำลังเล่น';
        resultBanner.className = 'result-banner';
        resultBanner.textContent = '';
      }

      updateMatchedClasses();
      redrawConnections();
    }

    window.addEventListener('resize', redrawConnections);
    resetButton.addEventListener('click', startRound);

    startRound();
  </script>
</body>
</html>
